name: CI

on:
  push:
  pull_request:

permissions:
  attestations: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/localsend-controller-target
  RUST_TOOLCHAIN: 1.97.1

jobs:
  controller:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test file-selection IPC
        run: node scripts/test-selection.mjs
      - name: Test bounded launcher download
        run: ./scripts/test-launcher
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - name: Format
        run: rustup run "$RUST_TOOLCHAIN" cargo fmt --manifest-path controller/Cargo.toml -- --check
      - name: Lint
        run: rustup run "$RUST_TOOLCHAIN" cargo clippy --manifest-path controller/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: rustup run "$RUST_TOOLCHAIN" cargo test --manifest-path controller/Cargo.toml --locked
      - name: Build
        run: rustup run "$RUST_TOOLCHAIN" cargo build --manifest-path controller/Cargo.toml --locked --release

  release-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify attested release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source controller-release.env

          [[ "$LOCALSEND_CONTROLLER_TAG" =~ ^controller-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$LOCALSEND_CONTROLLER_ASSET" == "localsend-controller-x86_64-unknown-linux-gnu" ]]
          [[ "$LOCALSEND_CONTROLLER_SIZE" =~ ^[1-9][0-9]{0,8}$ ]]
          ((LOCALSEND_CONTROLLER_SIZE <= 33554432))
          [[ "$LOCALSEND_CONTROLLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LOCALSEND_CONTROLLER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          release_dir="$(mktemp -d)"
          trap 'rm -rf -- "$release_dir"' EXIT
          gh release download "$LOCALSEND_CONTROLLER_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern "$LOCALSEND_CONTROLLER_ASSET" \
            --pattern "$LOCALSEND_CONTROLLER_ASSET.sha256"

          cd "$release_dir"
          [[ "$(stat --format='%s' -- "$LOCALSEND_CONTROLLER_ASSET")" == "$LOCALSEND_CONTROLLER_SIZE" ]]
          mapfile -t checksum_lines < "$LOCALSEND_CONTROLLER_ASSET.sha256"
          [[ "${#checksum_lines[@]}" -eq 1 ]]
          [[ "${checksum_lines[0]}" == "$LOCALSEND_CONTROLLER_SHA256  $LOCALSEND_CONTROLLER_ASSET" ]]
          sha256sum --check --strict "$LOCALSEND_CONTROLLER_ASSET.sha256"

          gh attestation verify "$LOCALSEND_CONTROLLER_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-controller.yml" \
            --signer-digest "$LOCALSEND_CONTROLLER_SOURCE_SHA" \
            --source-ref "refs/tags/$LOCALSEND_CONTROLLER_TAG" \
            --source-digest "$LOCALSEND_CONTROLLER_SOURCE_SHA" \
            --deny-self-hosted-runners

          chmod u+x -- "$LOCALSEND_CONTROLLER_ASSET"
          actual_version="$(./"$LOCALSEND_CONTROLLER_ASSET" --version | jq -er '.result.help | capture("^localsend-controller (?<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\n$").version')"
          [[ "$actual_version" == "${LOCALSEND_CONTROLLER_TAG#controller-v}" ]]
